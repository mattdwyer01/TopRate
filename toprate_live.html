<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- toprate_live.html is a static single file re-published under the
         same URL on every deploy - GitHub Pages/its CDN and mobile Safari
         have both been observed serving a stale cached copy for a while
         after a real deploy (confirmed, Sep 2026: a pushed fix tested
         correct locally against the exact same race data still showed the
         old behaviour on a real device). These hint browsers away from
         caching the document itself; they can't override the CDN's own
         HTTP headers, so a stale edge cache can still need a hard
         refresh, but this removes the browser's own layer of staleness. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Installable app: manifest, icons and service worker live at the site root next to toprate_live.html (see sw.js). -->

    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TopRate" />

ies for each runner, from a simulation of the race in which every runner's true figure is its projection plus noise (larger for horses with little history); hover a Proj value for the rated price and place price. It is the model's view, not a betting price.`]}),(0,z.jsx)(`p`,{children:`Horses with three or more prior rated runs use the main model. Horses with none, one or two prior runs (debut, second and third starters) use a separate light-history model that leans on the trainer, jockey, trials and race class instead of form. The runner panel says which one was used.`})]}),(0,z.jsx)(nn,{title:`Column and label guide`,children:(0,z.jsxs)(`ul`,{className:`list-disc space-y-1 pl-5`,children:[(0,z.jsxs)(`li`,{children:[(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`Peak`}),`: the highest rating the horse has run in the 12 months before the race (runner-page ratings, the same scale as WR). A blank means no rated run in that time.`]}),(0,z.jsxs)(`li`,{children:[(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`WR`}),`: the WPR projection at the weight carried today, and the race's ranking figure. `,(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`Base`}),` + `,(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`Adj`}),` = the projection, which the runner page explains.`]}),(0,z.jsxs)(`li`,{children:[(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`First starters`}),`: a horse with no form has no form rating. Its WR (shown with a ~ and an est tag) is an estimate: the level of the race from its experienced runners plus an adjustment for the runner's price against the field, so it mostly reflects the market. It is kept out of the Rating, the gap lines and the quaddie pools.`]}),(0,z.jsxs)(`li`,{children:[(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`Rating`}),`: since 23 Oct 2026 this is the WR itself (WR 100%). Base (TopRate's Nett) and Spd are shown for reference but are not counted; the small squares under the rt in a new stage.`]}),(0,z.jsxs)(`li`,{children:[(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`light`}),`: the runner has fewer than three rated runs, so the lighter model was used and the range is wider.`]}),(0,z.jsx)(`li`,{children:`The bar and the plus-or-minus figure show the likely range (about the middle half of outcomes), not a guarantee.`})]})}),(0,z.jsx)(nn,{title:`What goes in`,children:(0,z.jsxs)(`ul`,{className:`list-disc space-y-1 pl-5`,children:[(0,z.jsx)(`li`,{children:`The horse's recent WPRs (last run, last three, last five, career average, peak, how much it varies) and how long since it last ran.`}),(0,z.jsx)(`li`,{children:`Its record on this going, at this distance and at this track, and how far today's going and distance are from its last run.`}),(0,z.jsx)(`li`,{children:`Weight carried, barrier and field size, race class and the track's usual level.`}),(0,z.jsx)(`li`,{children:`Jockey and trainer effects (how their runners have rated against expectation, including this pairing and first-up runners), as at race day.`}),(0,z.jsx)(`li`,{children:`Position in the preparation (first up, second up) and its record from there; barrier trials and jump-outs, scaled for the track, distance and going.`}),(0,z.jsx)(`li`,{children:`What the stewards and race callers said about its last runs, and how strong the fields it recently beat were.`})]})}),(0,z.jsx)(nn,{title:`Base and Adj`,children:(0,z.jsxs)(`p`,{children:[(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`Base`}),` is the main model's projection. `,(0,z.jsx)(`span`,{className:`font-mono text-ink`,children:`Adj`}),` is a small suitability adjustment, usually within one WPR point, added to runners on the main model. It looks at how often the horse has been held up, raced wide or started slowly, how the track has played earlier on the card, the horse's late versus early sectional profile, and whether its jockey and trainer ride it further forward or back than its usual style (li
