<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- toprate_live.html is a static single file re-published under the
         same URL on every deploy - GitHub Pages/its CDN and mobile Safari
         have both been observed serving a stale cached copy for a while
         after a real deploy (confirmed, Sep 2026: a pushed fix tested
         correct locally against the exact same race data still showed the
         old behaviour on a real device). These hint browsers away from
         caching the document itself; they can't override the CDN's own
         HTTP headers, so a stale edge cache can still need a hard
         refresh, but this removes the browser's own layer of staleness. -->

    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />

,children:`Rating`}),`: the race's ranking figure at today's weight (bet-signal rating where the race has signals, otherwise the WPR projection; the line under the Race heading says which). `,(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Base`}),` + `,(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Adj`}),` = the WPR projection, which the runner page explains.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`SM`}),`: the suitability part of the WPR projection's Adj, relative to this field (green +0.5 or better, red -0.5 or worse). Runners at +0.5 or better do win more often (10.5% for the middle band, 13.9% at +0.5 to +1.0, 20% above +1.0), but the market already prices that: win rates matched the market-implied chances at every band, so SM is a reading aid for the map, not a source of value. It is not part of the bet-signal rating.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Model $`}),` and `,(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Edge`}),`: from the experimental bet-signal model (see Bets, below). Model $ is 1 / its win chance. Edge is its win chance times the current price, minus 1. Blank when the race is not fully drawn and priced.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Fixed $`}),`: the current fixed-odds win price. `,(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`FP`}),`: finishing position.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`RTS`}),`: run number this preparation. FU first-up, 2U second-up, and so on; FS and similar mark a first start in a new stage.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`light`}),`: the runner has fewer than three rated runs, so the lighter model was used and the range is wider.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`SELECT / VOL`}),`: the runner is a Select or Volume bet from the bet-signal model. The Bets tab lists them with stakes and a scoreboard.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`2 / 4 / 8 from top`}),`: the lines show runners within 2, 4 and 8 rating points of the top rated (at today's weight). On the bet-signal rating (85,000 races, 2022 to 2026) inside 2 holds 1.8 runners a race and about 50% of winners, inside 4 holds 2.9 and 67%, inside 8 holds 5.6 and 90%. On the WPR projection (15-month out-of-sample test) the same lines held 2.2 runners and 50%, 3.9 and 70%, 6.9 and 93%. They show where the winners are, not where the value is.`]}),(0,R.jsx)(`li`,{children:`The bar and the plus-or-minus figure show the likely range (about the middle half of outcomes), not a guarantee.`})]})}),(0,R.jsxs)(Qt,{title:`Bets (experimental)`,children:[(0,R.jsx)(`p`,{children:`The Bets tab and the Model $ / Edge columns come from a separate model that is not the WPR projection. It starts from each runner's current market price, corrects it using form, ratings, weight, barrier, jockey and trainer records (measured against the market), and returns a win chance. Model $ is 1 / that chance and Edge is the chance times the price, minus 1.`}),(0,R.jsxs)(`ul`,{className:`list-disc space-y-1 pl-5`,children:[(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Select`}),`: edge above 20% (above 30% for the favourite), price $3 or more (non-favourites under $20). Backtested at closing SP over 2022 to 2026 (walk-forward, each year scored by a model trained on earlier years): about 120 bets a year (0.7 a Saturday), ROI about +53%, positive in every year and quarter, about +30% without the 10 biggest winners and still +38% with a price 10% worse. Staked at 2 units.`]}),(0,R.jsxs)(`li`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Volume`}),`: edge above 5%, price $3 or more. About 10 bets on a Saturday. Backtested at SP: about +2% with the Select bets included, but -3% on its own and -13% with a price 10% worse. Staked at 0.25 units; it is there for action, not profit, and costs a little.`]}),(0,R.jsx)(`li`,{children:`1 unit is $50. The thresholds were chosen after looking at the same years they were tested on, so the true figures will be lower.`}),(0,R.jsx)(`li`,{children:`The backtest used the closing SP. Whether the edge holds at a fixed price taken before the jump is not yet known: the scoreboard on the Bets tab judges each bet at the price when the last pass was made, and is the check. Judge it over months, not weeks.`}),(0,R.jsx)(`li`,{children:`The earlier WPR-based value signal (rated price against market) lost 30 to 39% at every threshold in testing and has been removed.`})]})]}),(0,R.jsx)(Qt,{title:`What goes in`,children:(0,R.jsxs)(`ul`,{className:`list-disc space-y-1 pl-5`,children:[(0,R.jsx)(`li`,{children:`The horse's recent WPRs (last run, last three, last five, career average, peak, how much it varies) and how long since it last ran.`}),(0,R.jsx)(`li`,{children:`Its record on this going, at this distance and at this track, and how far today's going and distance are from its last run.`}),(0,R.jsx)(`li`,{children:`Weight carried, barrier and field size, race class and the track's usual level.`}),(0,R.jsx)(`li`,{children:`Jockey and trainer effects (how their runners have rated against expectation, including this pairing and first-up runners), as at race day.`}),(0,R.jsx)(`li`,{children:`Position in the preparation (first up, second up) and its record from there; barrier trials and jump-outs, scaled for the track, distance and going.`}),(0,R.jsx)(`li`,{children:`What the stewards and race callers said about its last runs, and how strong the fields it recently beat were.`})]})}),(0,R.jsx)(Qt,{title:`Base and Adj`,children:(0,R.jsxs)(`p`,{children:[(0,R.jsx)(`span`,{className:`font-mono text-ink`,children:`Base`}),` is the
