name: Settling forecast improvements (research)

# Manual research run (26 Oct 2026): research/settle_v6.py. Time-forward prediction of how a race will be run (position and gap at 800m, who leads), every
# variant of inputs and learner, in parallel jobs. Results are in each job's log and the shape-* artifacts; nothing is committed.
# Start it by changing research/shape_study.trigger and pushing.
on:
  workflow_dispatch:
  push:
    branches: [claude/cool-pascal-qqyctn]
    paths: [research/settle_v6.trigger]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        variants: ["B,L1,L2", "B,M,P", "B,ALL"]
    env:
      PYTHONPATH: .:projection:research
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn
      - name: Shape study
        run: python -W ignore -u research/settle_v6.py --variants "${{ matrix.variants }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settle-${{ strategy.job-index }}
          path: /tmp/settle_out
          if-no-files-found: ignore
