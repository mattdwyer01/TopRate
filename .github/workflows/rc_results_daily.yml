name: racing.com results, all states (daily)

# Finishing order, margin to the winner, SP, weight and barrier for every state from racing.com's
# raceEntries API (rc_results_ingest.py), written to data/gps/rc_results_runs_<year>.parquet. This is the
# margin source for own WPR ratings outside VIC/SA/QLD (country NSW, WA, TAS, NT, ACT), see CLAUDE.md.
# A meeting is saved only when every race has results, and meetings already stored are skipped, so reruns
# are cheap and a late meeting is picked up on the next run.
#
# Needs secrets RACINGCOM_API_KEY and RACINGCOM_CAL_API_KEY (same as gps_daily.yml). Uses the same runner
# variable: SCRAPER_RUNNER=self-hosted runs it on the Vultr AU box (about 1 request per second there).
# Scheduled runs only fire from the default branch; until this is merged to main, start it by hand
# (workflow_dispatch) on the branch.

on:
  schedule:
    - cron: "30 20 * * *"     # 06:30 AEST / 07:30 AEDT, after gps_daily.yml
  workflow_dispatch:
    inputs:
      days:
        description: "days to read, ending yesterday (default 3)"
        default: "3"
      since:
        description: "backfill from this date (YYYY-MM-DD) to yesterday; overrides days"
        default: ""
      max_requests:
        description: "request cap for this run (about 1 per second)"
        default: "1500"

permissions:
  contents: write

concurrency:
  group: gps-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ vars.SCRAPER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      RACINGCOM_API_KEY: ${{ secrets.RACINGCOM_API_KEY }}
      RACINGCOM_CAL_API_KEY: ${{ secrets.RACINGCOM_CAL_API_KEY }}
      IN_DAYS: ${{ github.event.inputs.days || '3' }}
      IN_SINCE: ${{ github.event.inputs.since || '' }}
      IN_MAX: ${{ github.event.inputs.max_requests || '1500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data/gps/
            rc_results_ingest.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.11"

      - name: Python packages
        run: |
          python -c "import pandas, pyarrow, requests" 2>/dev/null && exit 0
          python -m pip install pandas pyarrow requests \
            || python -m pip install --user pandas pyarrow requests \
            || python -m pip install --user --break-system-packages pandas pyarrow requests

      - name: Fetch results
        run: |
          [[ "$IN_DAYS" =~ ^[0-9]{1,3}$ ]] || { echo "bad days"; exit 1; }
          [[ "$IN_MAX" =~ ^[0-9]{1,5}$ ]] || { echo "bad max_requests"; exit 1; }
          args=(--max-requests "$IN_MAX" --deadline 5000)
          if [[ -n "$IN_SINCE" ]]; then
            [[ "$IN_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad since"; exit 1; }
            args+=(--since "$IN_SINCE")
          else
            args+=(--days "$IN_DAYS")
          fi
          python rc_results_ingest.py "${args[@]}"

      - name: Commit and push (small files only)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          shopt -s nullglob
          files=(data/gps/rc_results_runs_*.parquet)
          [ ${#files[@]} -gt 0 ] || { echo "no results files"; exit 0; }
          # Build the commit with plumbing on top of the latest remote tip: no working tree, no reset, no merge.
          # (A plain 'git reset' on this sparse, shallow checkout segfaulted, and other jobs push to main every few minutes.)
          for attempt in 1 2 3 4 5 6; do
            timeout 300 git fetch --depth=1 origin "$BRANCH" || { sleep 20; continue; }
            tip=$(git rev-parse FETCH_HEAD)
            export GIT_INDEX_FILE="$(mktemp -u)"
            git read-tree "$tip"
            changed=0
            for f in "${files[@]}"; do
              blob=$(git hash-object -w "$f")
              old=$(git rev-parse -q --verify "$tip:$f" || true)
              if [ "$blob" != "$old" ]; then
                git update-index --add --cacheinfo "100644,$blob,$f"; changed=1
              fi
            done
            if [ "$changed" = 0 ]; then echo "nothing new"; exit 0; fi
            tree=$(git write-tree)
            commit=$(git commit-tree "$tree" -p "$tip" -m "racing.com results $(date -u +%F)")
            rm -f "$GIT_INDEX_FILE"; unset GIT_INDEX_FILE
            if timeout 240 git push origin "$commit:refs/heads/$BRANCH"; then echo "pushed $commit"; exit 0; fi
            echo "push rejected (attempt $attempt), retrying on the new tip"
            sleep $((attempt * 10))
          done
          echo "::error::could not push after 6 attempts"; exit 1
