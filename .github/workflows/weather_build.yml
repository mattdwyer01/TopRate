name: Weather by racecourse (research)

# Manual research run (26 Oct 2026): research/weather_build.py geocodes the racecourses and downloads daily weather from Open-Meteo, then commits data/weather to the branch.
# Start it by changing research/weather_build.trigger and pushing.
on:
  workflow_dispatch:
  push:
    branches: [claude/trip-model-study]
    paths: [research/weather_build.trigger]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow
      - run: python -u research/weather_build.py
      - name: Commit weather files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather
          git commit -m "Weather by racecourse" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
