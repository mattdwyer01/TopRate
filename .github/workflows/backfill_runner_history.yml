name: TopRate Backfill Runner History

# Manual only. Fills price_opening/price_mid/is_letup/is_spell/
# blinkers_on/time_last600m/race_name/gear_changes (and every other
# HORSE_COLS/RUN_COLS/EXTRA_COLS field) into EXISTING rows of
# race_results_YYYY.csv.gz, via backfill_runner_history.py. See that
# script's own module docstring for the full design rationale - in
# particular why one fetch per unique horse_id (via the per-runner
# /runners/{run_id}/__data.json endpoint) is enough to backfill that
# horse's entire career, not just one run.
#
# Start small: --limit first (read the "served/not served/failed"
# counts before trusting a bigger run - see the script's own SAFETY
# docstring), then a --since range, before --all (tens of thousands of
# calls, can run for a long time).
#
# race_results_*.csv.gz is not touched by price_refresh.yml/
# tab_results.yml (confirmed in backfill_race_results.py's own
# docstring), so there's no CONTENT conflict with those jobs - but a
# push to main is still rejected (non-fast-forward) by ANY other job's
# commit in between, regardless of which files it touched, since it's
# the same branch tip. tab_results.yml commits every ~5 min, which is
# often faster than this script's own multi-minute merge cycle at
# scale, so the retry loop below tries a cheap rebase onto the fresh
# tip first (normally just a pointer move here) before falling back to
# a full reset + redo-from-scratch, same fix as backfill_race_results.yml
# (confirmed needed live, 6 Oct 2026: a 3000-horse run exhausted all 12
# retries and failed over ~57 min without this). At full --all scale
# (~95,700 horses), even the rebase-first fix needed its fetch/push
# timeouts raised further - toprate_data.json (~30MB) and
# toprate_history.json (~80MB) are both rewritten whole-file on
# tab_results.yml/price_refresh.yml commits, and 120s wasn't enough to
# catch up on even one such cycle under real load, let alone a
# multi-cycle backlog once one fetch attempt had already missed one.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only fetch the first N horses (most recently active first). Good for a first test run.'
        required: false
        type: string
      since:
        description: 'Only consider horses with a race on/after this date (YYYY-MM-DD) when picking which run_id to fetch. Leave blank for no date floor.'
        required: false
        type: string
      all:
        description: 'Process every horse on file (tens of thousands of calls - can take a long time)'
        required: false
        type: boolean
        default: false
      commit:
        description: 'Actually write the CSVs. Leave off for a dry run that only reports what would change.'
        required: false
        type: boolean
        default: false

concurrency:
  group: toprate-backfill-runner-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.limit }}" ] && [ -z "${{ inputs.since }}" ] && [ "${{ inputs.all }}" != "true" ]; then
            echo "::error::One of limit, since, or all must be set - refusing to guess the scope."
            exit 1
          fi

      # ─────────────────────────────────────────────────────────
      # Step 1: Fetch phase only. Writes results to a local JSON;
      # never touches race_results_*.csv.gz or the checkpoint.
      # ─────────────────────────────────────────────────────────
      - name: Fetch runner history
        env:
          TOPRATE_EMAIL: ${{ secrets.TOPRATE_EMAIL }}
          TOPRATE_PASSWORD: ${{ secrets.TOPRATE_PASSWORD }}
        run: |
          ARGS="--fetch-only backfill_runner_history.json"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
          echo "Running: python backfill_runner_history.py $ARGS"
          python backfill_runner_history.py $ARGS

      # ─────────────────────────────────────────────────────────
      # Step 2: Merge phase, only when commit=true was requested.
      # The python call itself updates
      # backfill_runner_history.checkpoint on disk (only for
      # horse_ids actually attempted, served or not), so it is
      # committed and pushed in the SAME git operation as the CSVs
      # below.
      # ─────────────────────────────────────────────────────────
      - name: Merge into race_results_*.csv.gz
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The python merge (read+fill+backup+write all 8 year files) is
          # expensive - minutes, not seconds, once a batch touches tens of
          # thousands of rows - so it runs ONCE here, outside the retry
          # loop below. tab_results.yml commits to main every ~5 min, which
          # is often faster than that, so a push WILL get rejected under
          # real contention; the loop's job is only to get this ALREADY-
          # MADE commit onto the new tip via a cheap rebase (normally just
          # a pointer move, since race_results_*.csv.gz/the checkpoint
          # aren't touched by anything else), never to redo the python work
          # on every retry. Redoing it every iteration (an earlier version
          # of this step, Sep-Oct 2026) was confirmed live to make things
          # WORSE under contention, not better: each iteration piled up a
          # fresh set of 8 large .pre_runner_backfill_* backup copies on
          # the runner's disk with nothing ever cleaning them up, and a
          # 3000-horse run exhausted 40+ minutes without ever landing.
          run_merge() {
            python backfill_runner_history.py --merge-only backfill_runner_history.json --commit
            git add race_results_*.csv.gz backfill_runner_history.checkpoint 2>/dev/null || true
          }

          run_merge
          if [[ -z "$(git status --porcelain -- race_results_*.csv.gz backfill_runner_history.checkpoint)" ]]; then
            echo "No changes to commit"
            pushed=true
          else
            git commit -m "Backfill runner history $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=false
          fi

          for i in $(seq 1 20); do
            [ "$pushed" = "true" ] && break
            if timeout 180 git push; then
              echo "Pushed on attempt $i"
              pushed=true
              break
            fi
            echo "Push rejected or timed out (attempt $i) - replaying this commit onto the fresh base"
            # 300s, not the original 120s: toprate_data.json (price_refresh.yml/
            # tab_results.yml, ~5 min cadence) is ~30MB and toprate_history.json
            # is ~80MB, both rewritten whole-file per commit. A single missed
            # fetch snowballs - the NEXT fetch has to catch up on an even bigger
            # backlog of such commits - and 120s wasn't enough even to catch up
            # on ONE cycle under real load (confirmed live, 6 Oct 2026: a
            # ~95,700-horse --all run's fetch timed out on all 12/12 attempts,
            # each attempt silently failing with no git error text before the
            # timeout, i.e. genuinely out of time, not a real git failure).
            timeout 300 git fetch origin || echo "fetch timed out/failed, retrying loop anyway"
            if timeout 180 git rebase "origin/${{ github.ref_name }}"; then
              # Rebase succeeded (the common case - no real content conflict),
              # loop back around to retry the push with this same commit;
              # no need to touch the python merge at all.
              sleep $((5 + RANDOM % 10))
              continue
            fi
            # Rebase genuinely failed (shouldn't happen given no content
            # overlap, but if it does, there's no cheap way forward) - only
            # NOW pay the expensive cost of resetting and redoing the merge
            # from the fresh base.
            git rebase --abort 2>/dev/null || true
            git reset --hard "origin/${{ github.ref_name }}" || true
            rm -f race_results_*.csv.gz.pre_runner_backfill_* 2>/dev/null || true
            run_merge
            if [[ -z "$(git status --porcelain -- race_results_*.csv.gz backfill_runner_history.checkpoint)" ]]; then
              echo "No changes to commit"
              pushed=true
              break
            fi
            git commit -m "Backfill runner history $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((10 + RANDOM % 20))
          done
          # Same incident as backfill_race_results.yml/backfill_bulk_meeting_fields.yml
          # (Sep 2026, see chat): exhausting retries used to fall through silently,
          # and the final git reset --hard discarded a fully-merged local commit while
          # the step still reported success. Never again - fail loudly instead.
          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push after all retry attempts - the locally merged commit was discarded by the final git reset. All this run's merged data is lost; re-run the backfill."
            exit 1
          fi

      - name: Dry-run report
        if: ${{ !inputs.commit }}
        run: |
          echo "Dry run requested (commit was left off) - reporting what WOULD change, nothing written."
          python backfill_runner_history.py --merge-only backfill_runner_history.json
