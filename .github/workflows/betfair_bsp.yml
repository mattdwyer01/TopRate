name: Betfair BSP history (AU runner)

# Downloads Betfair's published starting price files for Australian racing (betfair_bsp.py) into data/betfair_bsp/ and
# commits them to the branch that triggered the run. Betfair answers 403 outside Australia, so this needs the AU
# runner. The runner is shared with the live results poller, so a run fetches for at most 7 minutes; run it again
# for the rest (dates done are in data/betfair_bsp/index.json).
# Trigger: push a change to research/betfair_bsp.trigger (one line: since until kinds, e.g. "2025-01-01 2026-11-09 win"),
# or run it by hand.
on:
  push:
    paths:
      - research/betfair_bsp.trigger
  workflow_dispatch:
    inputs:
      since:
        description: "Start date YYYY-MM-DD"
        default: ""
      until:
        description: "End date YYYY-MM-DD (blank = yesterday)"
        default: ""
      kinds:
        description: "win, place or win,place"
        default: "win"

permissions:
  contents: write

concurrency:
  group: betfair-bsp
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          IN_SINCE: ${{ github.event.inputs.since }}
          IN_UNTIL: ${{ github.event.inputs.until }}
          IN_KINDS: ${{ github.event.inputs.kinds }}
        run: |
          if [ -n "$IN_SINCE" ]; then SINCE="$IN_SINCE"; UNTIL="$IN_UNTIL"; KINDS="${IN_KINDS:-win}";
          else read -r SINCE UNTIL KINDS _REST < research/betfair_bsp.trigger; fi
          ARGS=(--since "$SINCE" --kinds "${KINDS:-win}")
          [ -n "$UNTIL" ] && ARGS+=(--until "$UNTIL")
          python -u betfair_bsp.py download "${ARGS[@]}"
      - name: Commit and push
        run: |
          git config user.name "betfair-bsp bot"
          git config user.email "betfair-bsp-bot@users.noreply.github.com"
          git add data/betfair_bsp
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "Betfair BSP files $(TZ=Australia/Melbourne date +%F\ %H:%M)"
          for i in 1 2 3 4; do
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull -q --rebase origin "${GITHUB_REF_NAME}"     # the branch moved while this ran
            sleep 5
          done
          exit 1
