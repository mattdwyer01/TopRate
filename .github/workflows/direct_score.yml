name: "Direct model scores (research)"

# Scores the direct finishing-position model (direct_score.py) on the daily complete-field log and commits data/direct_scores/<date>.json
# (win chances under "races", Proj v2 ratings under "ratings", winner_v2.py). Readers: volume_rules.py (the v3 shadow rule, via volume_log.yml) and the payload key dv2
# (toprate_daily.py); the dashboard itself does not show Proj v2. About 10 to 15 minutes a run. Also startable by hand (dispatch with from and days).
on:
  # runs after every "TopRate Daily" run (which writes data/direct_log, the declared fields this scorer reads), so scores follow each declaration and scratching pass
  workflow_run:
    workflows: ["TopRate Daily"]
    types: [completed]
  workflow_dispatch:
    inputs:
      from:
        description: "First date to score (YYYY-MM-DD, default today UTC)"
        required: false
      days:
        description: "Number of days"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: direct-score
  cancel-in-progress: false

jobs:
  score:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn pyarrow
      - name: Score
        env:
          PROJECTION_RATINGS: toprate
        run: |
          FROM="${{ github.event.inputs.from }}"
          DAYS="${{ github.event.inputs.days }}"
          [ -z "$FROM" ] && FROM=$(TZ=Australia/Melbourne date +%Y-%m-%d)   # the Melbourne date, as direct_log.py snapshot uses
          [ -z "$DAYS" ] && DAYS=3
          python direct_score.py score --from "$FROM" --days "$DAYS"
      - name: Commit scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/direct_scores
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Direct model scores $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          done
          exit 1
