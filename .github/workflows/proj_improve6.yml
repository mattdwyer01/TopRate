name: "Proj improvement tests, batch 6: stacking (within-race target, CatBoost, new inputs) and the live complete-fields test"

# 10 Nov 2026: research/proj_improve5.py variants named <inputs>[.R][.C] (R = within-race target, C = CatBoost) in parallel jobs, research/proj_live_fields_test.py
# (models fitted before 9 Oct 2026, scored through the live path on every race in data/tr_results since), then research/proj_improve5_combine.py.
# Commits research/proj_improve6.json and research/proj_live_fields_test.json to the branch it ran on only.
on:
  workflow_dispatch:
  push:
    branches: [claude/beautiful-ptolemy-lf2x7x]
    paths: [research/proj_improve6.trigger]

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: k1, jobs: "lr06:1,lr06.R:1"}
          - {name: k2, jobs: "lr06.C:1,lr06.RC:1"}
          - {name: k3, jobs: "dirf:1,dirf.R:1"}
          - {name: k4, jobs: "dirf.C:1,dirf.RC:1"}
          - {name: k5, jobs: "allx:1,allx.R:1"}
          - {name: k6, jobs: "allx.C:1,allx.RC:1"}
          - {name: k7, jobs: "frm:1,frm.R:1,lfld:1"}
          - {name: k8, jobs: "allz:1,allz.R:1"}
          - {name: k9, jobs: "lin:1,one:1,xt:1"}
          - {name: k10, jobs: "cshort:1,nopg:1,l2:1"}
          - {name: k11, jobs: "allx.R:2,lr06.R:2"}
    env:
      PYTHONPATH: .:projection:research
      PROJECTION_RATINGS: toprate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn pyarrow catboost
      - name: Fit and predict
        run: python -W ignore research/proj_improve5.py --jobs "${{ matrix.jobs }}" --out pi6/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: pi6-${{ matrix.name }}
          path: pi6/
          retention-days: 14

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: .:projection:research
      PROJECTION_RATINGS: toprate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn pyarrow
      - name: Fit before 9 Oct and score the live fields
        run: python -W ignore research/proj_live_fields_test.py --out plf/live.pkl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plf-live
          path: |
            plf/
            research/proj_live_fields_test.json
          retention-days: 14

  score:
    needs: [fit, live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: pi6-*
          path: pi6
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: plf-live
          path: plf-live
      - name: Score
        run: |
          python -W ignore research/proj_improve5_combine.py pi6 --out research/proj_improve6.json
          mkdir -p research/pi6_info && cp pi6/*/*_info.json research/pi6_info/ || true
          cp plf-live/research/proj_live_fields_test.json research/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi6-result
          path: research/proj_improve6.json
      - name: Commit to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/proj_improve6.json research/pi6_info
          git add research/proj_live_fields_test.json || true
          git commit -m "Proj improvement tests, batch 6: result" || echo nothing to commit
          for i in 1 2 3 4 5 6; do git fetch origin ${{ github.ref_name }} && git rebase origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*5)); done
