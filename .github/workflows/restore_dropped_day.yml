# One-off repair (11 Oct 2026): a manual daily run removed every pending row of that day from toprate_runners.csv (the calendar call
# returned none of the day's races, see fetch_todays_races). Puts the day's rows back from a known-good commit WITHOUT touching
# anything else: on each attempt it starts from the current origin/main and only adds run_ids that are missing. Manual only.
name: Restore a dropped race day (one-off)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Race date to restore (YYYY-MM-DD)'
        required: true
      good_sha:
        description: 'Full commit SHA of toprate_runners.csv from before the rows were dropped'
        required: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the day's rows and push
        env:
          DAY: ${{ inputs.date }}
          GOOD_SHA: ${{ inputs.good_sha }}
        run: |
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date"; exit 1; }
          [[ "$GOOD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "need a full 40-character SHA"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin "$GOOD_SHA"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python restore_dropped_day.py "$DAY" "$GOOD_SHA"
            git add toprate_runners.csv
            [ -f toprate_runners_archive.csv.gz ] && git add toprate_runners_archive.csv.gz
            if git diff --cached --quiet; then
              echo "Nothing to restore (attempt $i) - main already has the rows"
              exit 0
            fi
            git commit -m "Restore dropped race day $DAY from ${GOOD_SHA:0:8}"
            if timeout 120 git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i), retrying on the new main"
            sleep 5
          done
          echo "Push failed after retries"
          exit 1
