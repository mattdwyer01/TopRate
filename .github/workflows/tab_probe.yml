name: TAB race field probe (self-hosted, manual)

# One-off, read-only. Runs tab_probe_race_fields.py on the AU self-hosted runner (TAB geo-blocks other hosts) to
# show what TAB returns for a FINISHED race: margins, race time, sectionals? See CLAUDE.md, "own WPR ratings".
# Makes a few dozen TAB requests, writes nothing to the repo (tab_raw/ is gitignored), never commits or pushes.
# The printed field list is in the job log; the raw JSON and the log are uploaded as the "tab-probe" artifact.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to probe (blank = yesterday, runner local time)'
        required: false
        type: string
      n:
        description: 'How many paying races to dump'
        required: false
        default: '3'
        type: string
      script:
        description: 'tab_probe_race_fields.py (field list) or tab_probe_links.py (follow the _links), tab_form_sample.py (past form for runners in every state), or sectional_probe.py (NSW/WA sectional sources, fixed URLs)'
        required: false
        default: 'tab_probe_race_fields.py'
        type: string
      setup_playwright:
        description: 'true = (re)build the one-off Playwright virtualenv at $HOME/pw-venv on the runner before probing (headless Chromium, a few hundred MB)'
        required: false
        default: 'false'
        type: string
      any_status:
        description: 'true = take races of any status (e.g. upcoming), to test past-form links'
        required: false
        default: 'false'
        type: string

# own group: must never queue behind or cancel the live results poller
concurrency:
  group: tab-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Playwright (one-off, only when asked)
        if: ${{ inputs.setup_playwright == 'true' }}
        run: |
          set -e
          # isolated virtualenv under the runner user's home: nothing is installed into system Python,
          # and removing $HOME/pw-venv (and ~/.cache/ms-playwright) undoes it
          if [ ! -x "$HOME/pw-venv/bin/python" ]; then python3 -m venv "$HOME/pw-venv"; fi
          "$HOME/pw-venv/bin/pip" install --quiet playwright
          "$HOME/pw-venv/bin/python" -m playwright install chromium
          # system libraries Chromium needs (libatk, libnss3, libgbm, ...): apt-get as root, approved by the user on 11 Oct 2026
          if [ "$(id -u)" = "0" ]; then
            "$HOME/pw-venv/bin/python" -m playwright install-deps chromium
          else
            sudo -n "$HOME/pw-venv/bin/python" -m playwright install-deps chromium
          fi
          "$HOME/pw-venv/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              pg = b.new_page()
              pg.goto("about:blank")
              print("playwright ok, chromium", b.version)
              b.close()
          PY

      - name: Probe TAB
        env:
          PROBE_DATE: ${{ inputs.date }}
          PROBE_N: ${{ inputs.n }}
          PROBE_ANY: ${{ inputs.any_status }}
          PROBE_SCRIPT: ${{ inputs.script }}
        run: |
          args=()
          if [[ -n "$PROBE_DATE" ]]; then
            [[ "$PROBE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date"; exit 1; }
            args+=(--date "$PROBE_DATE")
          fi
          [[ "$PROBE_N" =~ ^[0-9]{1,2}$ ]] || { echo "bad n"; exit 1; }
          args+=(--n "$PROBE_N")
          [[ "$PROBE_ANY" == "true" ]] && args+=(--any-status)
          case "$PROBE_SCRIPT" in
            tab_probe_race_fields.py|tab_probe_links.py|tab_form_sample.py|sectional_probe.py|browser_probe.py) ;;
            *) echo "unknown script"; exit 1 ;;
          esac
          PY=python
          if [[ "$PROBE_SCRIPT" == "browser_probe.py" ]]; then PY="$HOME/pw-venv/bin/python"; fi
          "$PY" "$PROBE_SCRIPT" "${args[@]}" 2>&1 | tee tab_probe_output.txt

      - name: Upload raw JSON and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-probe
          path: |
            tab_raw/
            tab_probe_output.txt
          if-no-files-found: warn
