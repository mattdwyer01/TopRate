name: "Speed inside Proj, option 2 inputs, converted history (research)"

# Manual research run (27 Oct 2026): research/proj_speed_joint.py. Reuses the context features built by the direct-v3 run (artifact direct-v3,
# run 40280640127), so it skips the 1.5 hour feature build. Nothing is committed; results are in the job log.
on:
  workflow_dispatch:
  push:
    branches: [claude/proj-improve-1-2-4]
    paths: [research/proj_speed_joint.trigger]

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .:projection:research
      PROJECTION_RATINGS: toprate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: direct-v3
          path: /tmp/dv3
          run-id: 40280640127
          github-token: ${{ github.token }}
      - run: cp /tmp/dv3/direct_ctx_feats.pkl /tmp/direct_ctx_feats.pkl
      - name: Proj and direct blend
        run: python -W ignore research/proj_speed_joint.py
