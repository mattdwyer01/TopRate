name: TopRate price refresh

# Triggered every 15 min during typical AU racing hours (10am - 10pm AEST)
# by an EXTERNAL cron-job.org schedule calling this workflow's
# workflow_dispatch endpoint directly - see HISTORY below for why. Adjust
# the cron-job.org schedule (not anything here) if you regularly bet
# outside these hours (e.g. WA evenings or NZ races).
#
# HISTORY (Aug 2026): originally ran on GitHub's own `schedule` event
# (every 5 min via cron, hours 0-12 UTC = 10am-10pm AEST). That proved
# unreliable well beyond normal scheduling jitter - confirmed via real run
# history a ~19-hour TOTAL outage (zero fires despite the workflow being
# enabled throughout), even after trying a clock-boundary offset and then a
# second independently-offset cron as redundancy. Replaced entirely with an
# external trigger on infrastructure independent of GitHub Actions' own
# scheduler - the actual fix the old `schedule` mitigations were reaching
# for. No `schedule` trigger here any more; if cron-job.org itself ever
# goes down, the fallback is a manual trigger from the Actions tab (or the
# dashboard's own workflow_dispatch calls) until it's restored.
on:
  workflow_dispatch:   # cron-job.org's real trigger; also allows manual runs

# Avoid concurrent runs - if a refresh is still going when the next one fires,
# skip rather than queue. Skipped runs are fine since the next trigger is
# only ~15 min away (cron-job.org's schedule, not a GitHub Actions cron).
concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8           # individual runs should take ~30 sec; 8 is a safety cap

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push CSV+HTML changes back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl scikit-learn joblib

      - name: Refresh prices
        env:
          # Same secrets used by the daily fetch workflow
          TOPRATE_EMAIL: ${{ secrets.TOPRATE_EMAIL }}
          TOPRATE_PASSWORD: ${{ secrets.TOPRATE_PASSWORD }}
        run: |
          python toprate_price_refresh.py --lookahead 2.0

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only commit if something actually changed - silence the noise if not.
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add toprate_runners.csv toprate_live.html
          # The dashboard's data payload - without this the live site's data
          # only actually updates via a manual deploy.bat run.
          [ -f toprate_data.json ] && git add toprate_data.json
          # Price snapshot log (Aug 2026: now committed, previously
          # deliberately excluded - see git history if resurrecting that
          # choice; the old exclusion meant it could never accumulate
          # across the Action's ephemeral runs, so the intraday price-trend
          # feature had no real data source in production). A prior attempt
          # at this git-add broke the whole commit step because the path
          # was still gitignored at the time (git add on an ignored path
          # exits 1) - it no longer is (see .gitignore), so this is safe.
          [ -f toprate_price_history.csv ] && git add toprate_price_history.csv
          git commit -m "Price refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Pull-then-push with retry. The remote moves often - the daily
          # workflow, manual pushes, and this workflow's own every-15-min
          # cron-job.org trigger all commit to main, so a plain push
          # frequently hits a non-fast-forward rejection
          # ("fetch first"). Rebase our single refresh commit on top of whatever
          # arrived, then push. Retry a few times in case the remote moves again
          # between pull and push. --no-edit/-X theirs keeps it non-interactive
          # and prefers incoming data on the rare content overlap (data files are
          # regenerated next run anyway, so losing our copy to theirs is safe).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i) - pulling and retrying"
            git pull --rebase -X theirs --no-edit || git rebase --abort
            sleep 3
          done
          echo "Push failed after retries"
          exit 1
