name: TopRate price refresh

# Triggered every 15 min during typical AU racing hours (10am - 10pm AEST)
# by an EXTERNAL cron-job.org schedule calling this workflow's
# workflow_dispatch endpoint directly - see HISTORY below for why. Adjust
# the cron-job.org schedule (not anything here) if you regularly bet
# outside these hours (e.g. WA evenings or NZ races).
#
# HISTORY (Aug 2026): originally ran on GitHub's own `schedule` event
# (every 5 min via cron, hours 0-12 UTC = 10am-10pm AEST). That proved
# unreliable well beyond normal scheduling jitter - confirmed via real run
# history a ~19-hour TOTAL outage (zero fires despite the workflow being
# enabled throughout), even after trying a clock-boundary offset and then a
# second independently-offset cron as redundancy. Replaced entirely with an
# external trigger on infrastructure independent of GitHub Actions' own
# scheduler - the actual fix the old `schedule` mitigations were reaching
# for. No `schedule` trigger here any more; if cron-job.org itself ever
# goes down, the fallback is a manual trigger from the Actions tab (or the
# dashboard's own workflow_dispatch calls) until it's restored.
on:
  workflow_dispatch:   # cron-job.org's real trigger; also allows manual runs

# Avoid concurrent runs - if a refresh is still going when the next one fires,
# skip rather than queue. Skipped runs are fine since the next trigger is
# only ~15 min away (cron-job.org's schedule, not a GitHub Actions cron).
concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # individual runs should take ~30 sec; raised from 8 to 12 (Sep 2026) so
    # the commit/push retry loop's own 60s-bounded timeouts (up to 5
    # attempts) have room to actually retry instead of the job timeout
    # cutting them off first - see that step's comment.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push CSV+HTML changes back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl scikit-learn joblib

      - name: Refresh prices
        env:
          # Same secrets used by the daily fetch workflow
          TOPRATE_EMAIL: ${{ secrets.TOPRATE_EMAIL }}
          TOPRATE_PASSWORD: ${{ secrets.TOPRATE_PASSWORD }}
        run: |
          python toprate_price_refresh.py --lookahead 2.0

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only commit if something actually changed - silence the noise if not.
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add toprate_runners.csv toprate_live.html
          # The dashboard's data payload - without this the live site's data
          # only actually updates via a manual deploy.bat run.
          [ -f toprate_data.json ] && git add toprate_data.json
          # Price snapshot log (Aug 2026: now committed, previously
          # deliberately excluded - see git history if resurrecting that
          # choice; the old exclusion meant it could never accumulate
          # across the Action's ephemeral runs, so the intraday price-trend
          # feature had no real data source in production). A prior attempt
          # at this git-add broke the whole commit step because the path
          # was still gitignored at the time (git add on an ignored path
          # exits 1) - it no longer is (see .gitignore), so this is safe.
          [ -f toprate_price_history.csv ] && git add toprate_price_history.csv
          # Per-meeting horse form history files (build_horse_history_files(),
          # called from toprate_price_refresh.py's rebuild_html() above) -
          # git-tracked but was missing from this staging list (Sep 2026 bug),
          # which left the working tree dirty whenever it actually changed
          # content. See daily.yml's identical comment for the full failure
          # chain this caused (dirty tree -> pull --rebase refuses -> rebase
          # --abort has nothing to abort -> bash -e kills the retry loop).
          [ -d horse_history ] && git add horse_history
          git commit -m "Price refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Pull-then-push with retry. The remote moves often - the daily
          # workflow, manual pushes, and this workflow's own every-15-min
          # cron-job.org trigger all commit to main, so a plain push
          # frequently hits a non-fast-forward rejection ("fetch first").
          # Rebase our single refresh commit on top of whatever arrived,
          # then push. Retry a few times in case the remote moves again
          # between pull and push.
          #
          # -X ours (not -X theirs) is deliberate: --ours/--theirs are
          # INVERTED in `git pull --rebase` vs. a normal merge - --ours
          # means the upstream/incoming commit, --theirs means this job's
          # own local commit being replayed. The repo's policy is "always
          # take incoming for these generated files" (see CLAUDE.md's
          # Deploy section - a real incident happened when a plain merge's
          # --theirs got copy-pasted into a rebase context), so -X ours is
          # the flag that actually means that here. (This step had -X
          # theirs until Sep 2026 - backwards the whole time; fixed to
          # match tab_results.yml's already-correct version.)
          #
          # Every git call is wrapped in `timeout`, same reasoning and same
          # live incident as daily.yml's identical loop (Sep 2026, see that
          # file's comment): an unbounded `git pull --rebase` can hang
          # silently on toprate_runners.csv's real 3-way text merge, and
          # this workflow's job timeout is only 8 minutes - a silent hang
          # here gets cancelled even faster than in daily.yml.
          for i in 1 2 3 4 5; do
            push_status=0
            timeout 60 git push || push_status=$?
            if [[ $push_status -eq 0 ]]; then
              echo "Pushed on attempt $i"
              exit 0
            elif [[ $push_status -eq 124 ]]; then
              echo "git push TIMED OUT after 60s (attempt $i)"
            else
              echo "git push failed, exit $push_status (attempt $i)"
            fi
            pull_status=0
            timeout 60 git pull --rebase -X ours --no-edit || pull_status=$?
            if [[ $pull_status -eq 124 ]]; then
              echo "git pull --rebase TIMED OUT after 60s (attempt $i) - aborting"
              git rebase --abort 2>/dev/null || true
            elif [[ $pull_status -ne 0 ]]; then
              echo "git pull --rebase failed, exit $pull_status (attempt $i) - aborting"
              git rebase --abort 2>/dev/null || true
            fi
            sleep 3
          done
          echo "Push failed after retries"
          exit 1
