name: TopRate price refresh

# Runs every 5 minutes during typical AU racing hours (10am - 10pm AEST = 00:00 - 12:00 UTC).
# Outside this window the workflow doesn't fire, saving ~17,000 free-tier minutes/month.
# Adjust the cron if you regularly bet outside these hours (e.g. WA evenings or NZ races).
#
# NOTE (Aug 2026): checked real run history via the GitHub API - this was firing
# every 20-55 min in practice, not every 5, despite the */5 cron below. GitHub's
# own docs warn that scheduled workflows can be delayed "during periods of high
# load", and every-5-min crons landing on round clock boundaries (:00, :05, :10...)
# are exactly when that contention peaks, since huge numbers of other repos' cron
# jobs are also aligned to those same boundaries. Offset to :02, :07, :12... below -
# a one-line, no-new-credentials mitigation to try first. If actual cadence (check
# via the Actions tab / API) is still far from 5 min after this, the real fix is an
# external trigger calling workflow_dispatch (already enabled below) instead of
# relying on GitHub's own `schedule` event, which isn't a code change worth making
# speculatively before confirming the offset alone didn't help.
on:
  schedule:
    - cron: '2-59/5 0-12 * * *'   # every 5 min offset from :02, hours 0-12 UTC = 10am-10pm AEST
  workflow_dispatch:               # allow manual trigger from GitHub UI

# Avoid concurrent runs - if a refresh is still going when the next one fires,
# skip rather than queue. Skipped runs are fine since the next slot is 5 min away.
concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8           # individual runs should take ~30 sec; 8 is a safety cap

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push CSV+HTML changes back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl scikit-learn joblib

      - name: Refresh prices
        env:
          # Same secrets used by the daily fetch workflow
          TOPRATE_EMAIL: ${{ secrets.TOPRATE_EMAIL }}
          TOPRATE_PASSWORD: ${{ secrets.TOPRATE_PASSWORD }}
        run: |
          python toprate_price_refresh.py --lookahead 2.0

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only commit if something actually changed - silence the noise if not.
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add toprate_runners.csv toprate_live.html
          # The dashboard's data payload - without this the live site's data
          # only actually updates via a manual deploy.bat run.
          [ -f toprate_data.json ] && git add toprate_data.json
          # Price snapshot log (Aug 2026: now committed, previously
          # deliberately excluded - see git history if resurrecting that
          # choice; the old exclusion meant it could never accumulate
          # across the Action's ephemeral runs, so the intraday price-trend
          # feature had no real data source in production). A prior attempt
          # at this git-add broke the whole commit step because the path
          # was still gitignored at the time (git add on an ignored path
          # exits 1) - it no longer is (see .gitignore), so this is safe.
          [ -f toprate_price_history.csv ] && git add toprate_price_history.csv
          git commit -m "Price refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Pull-then-push with retry. The remote moves often - the daily
          # workflow, manual pushes, and the every-5-min schedule all commit to
          # main, so a plain push frequently hits a non-fast-forward rejection
          # ("fetch first"). Rebase our single refresh commit on top of whatever
          # arrived, then push. Retry a few times in case the remote moves again
          # between pull and push. --no-edit/-X theirs keeps it non-interactive
          # and prefers incoming data on the rare content overlap (data files are
          # regenerated next run anyway, so losing our copy to theirs is safe).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push rejected (attempt $i) - pulling and retrying"
            git pull --rebase -X theirs --no-edit || git rebase --abort
            sleep 3
          done
          echo "Push failed after retries"
          exit 1
