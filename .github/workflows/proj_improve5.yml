name: "Proj improvement tests, batch 5: training length, weighting, collateral form, jockey switch, trainer patterns"

# 10 Nov 2026: research/proj_improve5.py in parallel jobs (each builds the frames, fits a few variant:seed pairs on the live structure fitted before 2026 and predicts the
# 2026 page runs and the 2026 complete converted fields), then research/proj_improve5_combine.py scores them. Commits research/proj_improve5.json to the branch it ran on only.
on:
  workflow_dispatch:
  push:
    branches: [claude/beautiful-ptolemy-lf2x7x]
    paths: [research/proj_improve5.trigger]

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: j1, jobs: "base:1,long:1", extra: ""}
          - {name: j2, jobs: "lr06:1,lr06:2", extra: ""}
          - {name: j3, jobs: "big:1,deep:1", extra: ""}
          - {name: j4, jobs: "cs5:1,small:1", extra: ""}
          - {name: j5, jobs: "reg:1,hub25:1,hub8:1", extra: ""}
          - {name: j6, jobs: "wrec:1,wpg:1,rdm:1", extra: ""}
          - {name: j7, jobs: "frank:1,jsw:1", extra: ""}
          - {name: j8, jobs: "tfu:1,ped:1", extra: ""}
          - {name: j9, jobs: "dirf:1,allx:1", extra: ""}
          - {name: j10, jobs: "cat:1", extra: ""}
          - {name: j11, jobs: "h16:1", extra: "--conv-from 2016"}
          - {name: j12, jobs: "allx:2,lr06:3", extra: ""}
    env:
      PYTHONPATH: .:projection:research
      PROJECTION_RATINGS: toprate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn pyarrow catboost
      - name: Fit and predict
        run: python -W ignore research/proj_improve5.py --jobs "${{ matrix.jobs }}" --out pi5/${{ matrix.name }} ${{ matrix.extra }}
      - uses: actions/upload-artifact@v4
        with:
          name: pi5-${{ matrix.name }}
          path: pi5/
          retention-days: 14

  score:
    needs: fit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: pi5-*
          path: pi5
      - name: Score
        run: |
          python -W ignore research/proj_improve5_combine.py pi5 --out research/proj_improve5.json
          mkdir -p research/pi5_info && cp pi5/*/*_info.json research/pi5_info/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi5-result
          path: research/proj_improve5.json
      - name: Commit to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/proj_improve5.json research/pi5_info
          git commit -m "Proj improvement tests, batch 5: result" || echo nothing to commit
          for i in 1 2 3 4 5 6; do git fetch origin ${{ github.ref_name }} && git rebase origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*5)); done
