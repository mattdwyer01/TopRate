name: TAB diagnose test (temporary, hosted runner)

# TEMPORARY, throwaway workflow - answers one empirical question: does TAB's
# public API actually block GitHub-hosted runners, or was that worth
# verifying rather than assuming? Runs on ubuntu-latest deliberately (NOT the
# self-hosted requirement documented in tab_results.yml) to get a real answer
# from GitHub's actual network, since the interactive dev sandbox this was
# authored from sits behind its own allowlist proxy and can't reach TAB (or
# even ipinfo.io) at all to test this.
#
# Delete this file once the answer is in - it's a one-off diagnostic, not
# part of the real integration (see tab_results.yml / tab_results_poller.py).
#
# Triggers on push (not just workflow_dispatch): workflow_dispatch can only
# be fired via the API/UI for a workflow file that already exists on the
# repo's default branch, which this one deliberately doesn't (it's a
# throwaway, not going anywhere near main) - so `push` is what actually lets
# it run from this feature branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/tabcorp-api-live-results-zi8kg3]
    paths: [.github/workflows/tab_diagnose_test.yml]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install curl_cffi
        run: python -m pip install curl_cffi

      - name: Where does GitHub think this runner is?
        run: curl -s --max-time 15 https://ipinfo.io/json || echo "ipinfo request failed"

      - name: Run the poller's own diagnose check
        run: python tab_results_poller.py --diagnose
