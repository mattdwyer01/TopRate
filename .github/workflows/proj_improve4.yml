name: "Proj improvement tests: pedigree, seed bagging, complete fields, finishing-position inputs"

# 9 Nov 2026: research/proj_improve4.py in five parallel jobs (each fits a few variant:seed pairs on the live structure, fitted before 2026, predicts the 2026 page runs and
# the 2026 complete converted fields), then research/proj_improve4_combine.py scores them. Commits research/proj_improve4.json to the branch it ran on only.
on:
  workflow_dispatch:
  push:
    branches: [claude/wizardly-fermi-ijxb3p]
    paths: [research/proj_improve4.trigger]

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: j1, jobs: "base:1,base:2"}
          - {name: j2, jobs: "base:3,fld:1"}
          - {name: j3, jobs: "ped:1,dirf:1"}
          - {name: j4, jobs: "all:1,all:2"}
          - {name: j5, jobs: "all:3"}
    env:
      PYTHONPATH: .:projection:research
      PROJECTION_RATINGS: toprate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn
      - name: Fit and predict
        run: python -W ignore research/proj_improve4.py --jobs "${{ matrix.jobs }}" --out pi4/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: pi4-${{ matrix.name }}
          path: pi4/
          retention-days: 14

  score:
    needs: fit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: pi4-*
          path: pi4
      - name: Score
        run: |
          ls -R pi4 | head -40
          python -W ignore research/proj_improve4_combine.py pi4 --out research/proj_improve4.json
          mkdir -p research/pi4_info && cp pi4/*/*_info.json research/pi4_info/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi4-result
          path: research/proj_improve4.json
      - name: Commit to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add research/proj_improve4.json research/pi4_info
          git commit -m "Proj improvement tests: result" || echo nothing to commit
          for i in 1 2 3 4 5 6; do git fetch origin ${{ github.ref_name }} && git rebase origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep $((i*5)); done
