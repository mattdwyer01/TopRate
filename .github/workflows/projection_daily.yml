name: Projection (new WPR model)

# Builds wpr_projection_new.json and appends to wpr_projection_log.csv.gz (the log the dashboard reads), plus trip_map.json on a full run,
# with the projection/ pipeline.
#
# full: rebuilds the cached jockey/trainer/field tables from the whole history, projects every declared upcoming race, and rebuilds the
#       trip map (about 20 minutes). Runs daily after the overnight GPS job (gps_daily.yml, 06:00 AEST) and the 23:00 results slot.
# fast: re-scores from the cached tables (about 4 minutes). Use it after a going change or a new declaration, e.g. from cron-job.org
#       (same pattern as price_refresh.yml / daily.yml: POST to this workflow's workflow_dispatch with {"ref":"main","inputs":{"mode":"fast"}}).
#       It restores the most recent daily cache; if there is none it falls back to a full run.
#
# GitHub's own `schedule` is unreliable here (see daily.yml HISTORY), so the cron below is only a fallback; the dependable trigger is a
# cron-job.org entry calling workflow_dispatch with mode=full each morning (suggest 07:30 Melbourne time) plus mode=fast entries during racing hours.
on:
  schedule:
    - cron: "40 21 * * *"      # 07:40 AEST / 08:40 AEDT, after gps_daily.yml (06:00 AEST) has normally finished
  workflow_dispatch:
    inputs:
      mode:
        description: "full (daily rebuild + trip map) or fast (re-score from cache)"
        required: false
        default: "full"
        type: string

permissions:
  contents: write

# Separate group from the data jobs on purpose (a shared lock starved tab_results.yml once, see daily.yml). Fast runs queue behind a running full run.
concurrency:
  group: projection
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projection/requirements.txt

      - run: pip install -r projection/requirements.txt

      - name: Restore cached tables
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: projection/cache
          key: projection-cache-none
          restore-keys: projection-cache-

      - name: Decide mode
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE=full
          if [ "$MODE" = "fast" ] && [ ! -f projection/cache/tables.pkl ]; then
            echo "No cached tables found, running full instead"
            MODE=full
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build cache and project (full)
        if: steps.mode.outputs.mode == 'full'
        run: |
          python projection/run.py --build-cache
          python projection/run.py
          python analysis/trip_map/build_trip_map.py

      - name: Re-score from cache (fast)
        if: steps.mode.outputs.mode == 'fast'
        run: python projection/run.py --fast

      - name: Save cache
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: projection/cache
          key: projection-cache-${{ github.run_id }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage_outputs() {
            [ -f wpr_projection_new.json ] && git add wpr_projection_new.json
            [ -f trip_map.json ] && git add trip_map.json
            [ -f wpr_projection_log.csv.gz ] && git add wpr_projection_log.csv.gz
          }
          stage_outputs
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Projection ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          # Same recovery as daily.yml: take the new tip (reset --mixed keeps our freshly generated files) and re-commit, no rebase.
          for i in 1 2 3 4 5; do
            push_status=0
            timeout 60 git push || push_status=$?
            if [[ $push_status -eq 0 ]]; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "git push failed, exit $push_status (attempt $i)"
            timeout 120 git fetch origin main || { sleep 3; continue; }
            git reset --mixed origin/main
            stage_outputs
            if git diff --cached --quiet; then
              echo "Remote already has these outputs"
              exit 0
            fi
            git commit -m "Projection ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 3
          done
          echo "Giving up after 5 push attempts"
          exit 1
