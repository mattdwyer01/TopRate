name: TAB live results (self-hosted)

# Fast, provisional per-race results, intraday track condition/rail updates,
# and live fixed prices, from TAB's public API (see TAB_API_NOTES.md and
# tab_results_poller.py). Results close the gap where the authoritative feed
# (update_results() in toprate_daily.py, run via price_refresh.yml) can't
# resolve a race until its WHOLE MEETING finishes.
# Writes finish_position/won/placed/interim_resulted (per runner),
# going/track_grading/rail_position (per meeting), and fixed_win_price/
# scratched (per runner, from an open race's fixedOdds - bounded to races
# starting within ~2hr, same window toprate_price_refresh.py already uses,
# a SECOND independent source alongside it, not a replacement); never
# resulted/wpr_actual/comments_* - see tab_results_poller.py's docstring
# for why that split matters. A real going change DOES trigger a WPR
# ratings recompute, scoped to just the meeting(s) that changed (see
# CLAUDE.md's Current state section for the measured cost that made this
# safe). A plain results/prices/scratches cycle publishes via a fast direct
# JSON patch instead of the full --rebuild-only pipeline (see
# tab_results_poller.py's PUBLISHING docstring section) - only a going
# change (or the patch safely falling back) still runs the full ~2-3 min
# rebuild, so most cycles now finish in well under a minute.
#
# MUST run on a self-hosted runner registered from a real Australian
# machine - TAB geo-blocks and TLS-fingerprints most cloud/VPS hosts,
# confirmed against GitHub-hosted runners specifically, though a Vultr AU
# datacenter instance has been confirmed working in practice despite that
# general rule (see TAB_API_NOTES.md). This is NOT an optional
# infrastructure choice for whichever machine actually runs it - it's the
# one access requirement TAB itself imposes.
#
# Triggered externally, like price_refresh.yml, NOT via GitHub's own
# `schedule:` event - that trigger is already known unreliable on this repo
# (price_refresh.yml hit a ~19hr silent outage on it; see its own comments).
# Point an external scheduler (cron-job.org, same as price_refresh.yml) at
# this workflow's workflow_dispatch endpoint, firing every 1-2 min during AU
# racing hours. Adjust frequency there, not here.
#
# ---- Runner setup (one-time, on the AU machine) ----
#   1. This repo's GitHub page -> Settings -> Actions -> Runners -> New self-
#      hosted runner. Follow the generated install commands for that
#      machine's OS, then install it as a background service (the runner
#      setup script offers this - `./svc.sh install && ./svc.sh start` on
#      Linux/macOS, an equivalent Windows service option on Windows) so it's
#      alive without anyone logged in.
#   2. Install this project's Python deps on that machine ONCE, matching what
#      running toprate_daily.py --rebuild-only and tab_results_poller.py need:
#        pip install pandas requests openpyxl scikit-learn joblib curl_cffi
#      Deliberately NOT reinstalled on every run below (unlike
#      price_refresh.yml's hosted runner, which starts from a clean VM every
#      time) - a self-hosted runner's filesystem persists between jobs, so
#      reinstalling on every 1-2 min trigger would be pure waste.
#   3. Run `python tab_results_poller.py --diagnose` on that machine once to
#      confirm it actually clears TAB's access checks before relying on this
#      workflow for anything.
on:
  workflow_dispatch:   # cron-job.org's real trigger; also allows manual runs

# Avoid concurrent runs - if a poll is still going when the next one fires,
# skip rather than queue (matches price_refresh.yml's reasoning: the next
# trigger is only a minute or two away regardless).
#
# SHARED group name, TRIED then REVERTED same day (Sep 2026): briefly
# shared one group with daily.yml/price_refresh.yml to stop daily.yml's
# git-pull-rebase timeouts. Made THAT better but broke this job far worse:
# an unexplained extra trigger was firing daily.yml every ~15 min that same
# day, and sharing the lock meant this job (needs to run every 5 min for
# live results) got queued out and CANCELLED repeatedly whenever daily.yml
# held it - confirmed live (2026-09-16, real user report: Caulfield results
# silently stopped updating for ~1hr15 while this was in effect). Reverted
# back to this job's own group the same day - a live, time-sensitive
# results feed being starved is worse than daily.yml occasionally needing a
# manual retrigger.
concurrency:
  group: tab-results
  cancel-in-progress: false

jobs:
  poll:
    runs-on: [self-hosted]
    # 15 min is headroom for the SLOW path (a going change, or
    # patch_data_json falling back to a full rebuild), which still does the
    # form-history/settling-band rebuild that regularly takes ~2.5-3 min on
    # this 1 vCPU/2GB box - a 5-min cap left too little room for that plus
    # the commit/push retry loop and killed a real run (2026-09-11, run #4)
    # mid-retry with "operation was canceled" while it was still
    # legitimately working, not stuck. A typical cycle (fast JSON patch,
    # see tab_results_poller.py's PUBLISHING docstring section) finishes in
    # well under a minute now, so this ceiling is rarely approached.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Poll TAB and update results
        # --no-push: this job handles commit/push itself below, same split
        # as price_refresh.yml's own steps.
        run: python tab_results_poller.py --once --no-push

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add toprate_runners.csv toprate_data.json
          # Gzip companion (Sep 2026, see toprate_daily.py's
          # _write_data_json) - must be committed alongside toprate_data.json
          # itself every time (patch_data_json() writes both together), or
          # it goes stale relative to the plain file this fast-path cycle
          # just patched.
          [ -f toprate_data.json.gz ] && git add toprate_data.json.gz
          # Per-meeting horse form history files - only touched on the rare
          # full-rebuild path (a real going change forces rebuild_html(), see
          # CLAUDE.md), but git-tracked and was missing from this staging
          # list (Sep 2026 bug) same as daily.yml/price_refresh.yml - see
          # daily.yml's comment for the dirty-tree failure chain this risked.
          [ -d horse_history ] && git add horse_history
          # tracker_high_volume.csv/tracker_low_volume.csv - speedmap_jockey_
          # tracker.py's sjt.main() (called from tab_results_poller.py's
          # run_once() on every active cycle, see its own comment) reconciles
          # picks against toprate_data.json and rewrites these two CSVs
          # in-place, but this step's own git add never staged them (found
          # 2026-09-17: reconcile logged "reconciled 2 newly-resulted
          # pick(s)" in this exact job's own output, yet the commit right
          # after only touched toprate_runners.csv/toprate_data.json - the
          # reconciled CSV content sat as an uncommitted, unstaged local
          # change that the NEXT cycle's checkout step (git clean -ffdx +
          # git reset --hard) silently discarded before anyone ever
          # committed it, over and over, every cycle, since the day that
          # reconcile-on-every-cycle fix shipped). tab_results_poller.py's
          # own commit_and_push() (used when NOT run with --no-push) already
          # staged these correctly - this workflow's own separate shell
          # step just never matched it.
          [ -f tracker_high_volume.csv ] && git add tracker_high_volume.csv
          [ -f tracker_low_volume.csv ] && git add tracker_low_volume.csv
          git commit -m "TAB live results $(date -u +%Y-%m-%dT%H:%MZ)"
          # Pull-then-push with retry, same rationale as price_refresh.yml:
          # the daily workflow, manual pushes, and this job's own frequent
          # trigger all commit to main, so a plain push often gets rejected.
          # -X ours (not -X theirs) is deliberate here: --ours/--theirs are
          # INVERTED in a rebase vs. a merge - in `git pull --rebase`, --ours
          # is the upstream/incoming commit and --theirs is this job's own
          # local commit being replayed. The repo's policy is "always take
          # incoming for these generated files" (see CLAUDE.md's Deploy
          # section for the real incident this caused when a plain merge's
          # --theirs got copy-pasted into a rebase context), so -X ours is
          # the flag that actually means that here.
          #
          # Every git call below is wrapped in `timeout` (2026-09-11: this
          # step was repeatedly observed hanging 5-13 minutes with NO error
          # in the job log before being externally cancelled - disk space
          # was ruled out as the cause, but the actual hang was never
          # pinned down since a cancelled step's log gives no clue which
          # command was stuck). Bounding each call turns a silent multi-
          # minute hang into a fast, loud "TIMED OUT" line naming the exact
          # command, so the next occurrence is actually diagnosable instead
          # of just another mystery cancellation.
          # NOTE (2026-09-11): the first version of this used
          # `timeout 25 git push; push_status=$?`, which is NOT safe under
          # this step's default `bash -e` - the moment git push fails,
          # bash exits the whole script right there, before push_status is
          # even captured, so the retry loop below never ran (confirmed
          # live: a run failed after exactly ONE rejected push instead of
          # retrying up to 5 times). `cmd || push_status=$?` is the
          # -e-safe form - the `||` clause itself absorbs the failure.
          for i in 1 2 3 4 5; do
            push_status=0
            timeout 25 git push || push_status=$?
            if [[ $push_status -eq 0 ]]; then
              echo "Pushed on attempt $i"
              exit 0
            elif [[ $push_status -eq 124 ]]; then
              echo "git push TIMED OUT after 25s (attempt $i)"
            else
              echo "git push failed, exit $push_status (attempt $i)"
            fi
            pull_status=0
            timeout 25 git pull --rebase -X ours --no-edit || pull_status=$?
            if [[ $pull_status -eq 124 ]]; then
              echo "git pull --rebase TIMED OUT after 25s (attempt $i) - aborting"
              git rebase --abort 2>/dev/null || true
            elif [[ $pull_status -ne 0 ]]; then
              echo "git pull --rebase failed, exit $pull_status (attempt $i) - aborting"
              git rebase --abort 2>/dev/null || true
            fi
            sleep 3
          done
          echo "Push failed after retries"
          exit 1

      - name: Prune stale git objects (prevent checkout bloat)
        # This checkout persists across runs on the self-hosted runner
        # (unlike a GitHub-hosted runner, which starts fresh every time).
        # actions/checkout's shallow re-fetch each cycle leaves the
        # PREVIOUS cycle's blobs as loose/unreachable objects the moment the
        # local ref moves - and since this repo commits a large near-binary
        # toprate_data.json on almost every cycle, git's own gc.auto only
        # prunes those after its default 2-week grace window, which is
        # exactly what silently grew this checkout to 36GB and filled the
        # box's disk (2026-09-11 outage - see CLAUDE.md's Current state
        # note). Force immediate pruning every cycle instead of waiting on
        # git's defaults; cheap here since the checkout is shallow
        # (depth 1), so there's very little reachable history to walk.
        # if: always() -- the checkout's fetch deposits the stale objects
        # regardless of whether the commit/push step above found changes
        # or even failed, so this needs to run either way.
        if: always()
        run: |
          git reflog expire --expire=now --all
          git gc --prune=now
