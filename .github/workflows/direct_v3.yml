name: Direct model v3 (research)

# Manual research run (26 Oct 2026): builds the Proj context/relevance/speed features for the converted full-field history, then trains and
# scores research/direct_finish_v3.py (V2 control, V3a with Proj inputs, V3b with race shape and draw). Needs about 1.5 to 2 hours, too long for
# the cloud session (its sandbox restarts between turns). Results are in the job log and the direct-v3 artifact; nothing is committed.
on:
  workflow_dispatch:
  push:
    branches: [claude/trip-model-study]
    paths: [research/direct_v3.trigger]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: .:projection:research
      PROJECTION_RATINGS: toprate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r projection/requirements.txt scipy scikit-learn
      - name: Context features
        run: python -W ignore research/direct_ctx_features.py
      - name: Direct model v3
        run: python research/direct_finish_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-v3
          path: |
            /tmp/direct_v3_*
            /tmp/direct_ctx_feats.pkl
