# One-off, read-only probe (11 Oct 2026): daily.yml's login to api.toprate.au has returned 403 from GitHub-hosted runners since
# 9 Oct 02:15Z although the account works in a browser. This tries the same login from the self-hosted (Australian) runner and
# prints ONLY the HTTP status and whether a token came back, never the token or the credentials. Run manually (workflow_dispatch).
name: TopRate login probe (self-hosted, read-only)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try the TopRate login
        env:
          TOPRATE_EMAIL: ${{ secrets.TOPRATE_EMAIL }}
          TOPRATE_PASSWORD: ${{ secrets.TOPRATE_PASSWORD }}
        run: |
          python - <<'PY'
          import requests, toprate_daily as td
          r = requests.post(f"{td.API_BASE}/auth/v1/token?grant_type=password",
                            headers={"apikey": td.ANON_KEY, "Content-Type": "application/json"},
                            json={"email": td.EMAIL, "password": td.PASSWORD}, timeout=30)
          ok = r.status_code == 200 and bool(r.json().get("access_token"))
          print("login HTTP status:", r.status_code, "| token returned:", ok)
          print("server:", r.headers.get("server"), "| via cloudflare:", r.headers.get("cf-ray") is not None)
          if not ok:
              print("body (first 150 chars, no credentials in it):", (r.text or "")[:150].replace("\n", " "))
          PY

      - name: Which TopRate endpoints does Cloudflare block? (no credentials sent)
        run: |
          python - <<'PY'
          import requests, toprate_daily as td
          def show(name, r):
              cf = "<!DOCTYPE html" in (r.text or "")[:30] and r.headers.get("server") == "cloudflare"
              print(f"{name}: HTTP {r.status_code} | cloudflare block page: {cf} | body: {(r.text or '')[:90]!r}")
          H = {"apikey": td.ANON_KEY, "Content-Type": "application/json"}
          show("refresh grant, dummy token", requests.post(f"{td.API_BASE}/auth/v1/token?grant_type=refresh_token", headers=H, json={"refresh_token": "dummy"}, timeout=30))
          show("rpc call, no login          ", requests.post(f"{td.API_BASE}/rest/v1/rpc/get_race_detail", headers=H, json={"rc_id": "1"}, timeout=30))
          show("auth settings, no login     ", requests.get(f"{td.API_BASE}/auth/v1/settings", headers={"apikey": td.ANON_KEY}, timeout=30))
          PY

      - name: Which hosts does the toprate.au website call? (public page and scripts, hostnames only)
        run: |
          python - <<'PY'
          import re, requests
          UA = {"User-Agent": "Mozilla/5.0 (compatible; TopRate-owner-check)"}
          def get(u):
              try:
                  return requests.get(u, headers=UA, timeout=30)
              except Exception as e:
                  print("GET", u, "failed:", type(e).__name__); return None
          r = get("https://toprate.au/")
          if r is None: raise SystemExit
          print("site HTTP", r.status_code, "| server:", r.headers.get("server"), "| bytes:", len(r.text))
          hosts = set(re.findall(r"https?://([A-Za-z0-9.-]+\.[a-z]{2,})", r.text))
          srcs = set(re.findall(r'(?:src|href)=["\']([^"\']+\.js)["\']', r.text))
          srcs |= set(re.findall(r'["\'](/_app/immutable/[^"\']+\.js)["\']', r.text))
          print("script files:", len(srcs))
          for s in sorted(srcs)[:60]:
              u = s if s.startswith("http") else "https://toprate.au" + (s if s.startswith("/") else "/" + s)
              x = get(u)
              if x is not None and x.status_code == 200:
                  hosts |= set(re.findall(r"https?://([A-Za-z0-9.-]+\.[a-z]{2,})", x.text))
          keep = sorted(h for h in hosts if any(k in h for k in ("toprate", "supabase", "api.", "rpc", "cloudfront", "workers.dev")))
          print("candidate hosts:", keep)
          PY

