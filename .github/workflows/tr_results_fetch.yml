name: toprate.au post-race results for the meeting review (manual)

# 21 Oct 2026: reads each finished race's page (raceResult for the whole field: atw/wpr, positions at 800m and 400m, margin, price, weight) into
# data/tr_results/<date>.json.gz. Read-only against toprate.au. Commits ONLY data/tr_results, to the branch it runs on (not main), so it cannot collide with the
# live data jobs. Needs the same secrets as daily.yml.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back from yesterday"
        default: "7"
      refetch:
        description: "Fetch races already stored again (rating status moves on from Preliminary)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: tr-results-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOPRATE_EMAIL: ${{ secrets.TOPRATE_EMAIL }}
      TOPRATE_PASSWORD: ${{ secrets.TOPRATE_PASSWORD }}
      TOPRATE_ANON_KEY: ${{ secrets.TOPRATE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Anon key fallback (same as daily.yml)
        run: |
          if [ -z "$TOPRATE_ANON_KEY" ]; then
            d=$(mktemp -d) && git -C "$d" init -q && git -C "$d" remote add origin "https://github.com/${{ github.repository }}.git"
            git -C "$d" fetch -q --depth=1 --filter=blob:none origin 774453e455dcec061aca6c30ca6c6131bb2b2cdd
            git -C "$d" show FETCH_HEAD:toprate_daily.py > "$d/old_td.py"
            KEY=$(python - "$d/old_td.py" <<'PY'
          import re, sys
          m = re.search(r'^ANON_KEY\s*=\s*["\']([^"\']+)["\']', open(sys.argv[1]).read(), re.M)
          print(m.group(1) if m else "")
          PY
          )
            echo "::add-mask::$KEY"
            echo "TOPRATE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          fi
      - name: Fetch
        run: |
          flag=""; [ "${{ inputs.refetch }}" = "true" ] && flag="--refetch"
          python toprate_result_fetch.py --days "${{ inputs.days }}" $flag
      - name: Commit data/tr_results to this branch
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tr_results
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "TopRate post-race results $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            git fetch -q origin "${GITHUB_REF_NAME}" && git rebase -q "origin/${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done
          exit 1
