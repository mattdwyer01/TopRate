name: TopRate Daily

# Triggered manually from the dashboard's Settings tab "Fetch data" button via
# workflow_dispatch. The optional `date` input lets the dashboard request a
# specific date (used by the "Fetch [date]" button); empty means today.
#
# The intended local-time (Australia/Melbourne) schedule is:
#   09:00 - fetch today's races.
#   09:30 - pre-fetch tomorrow's races.
#   11:30 - re-fetch today's races (catches late scratches/price moves the
#     9:00 run missed).
#   12:00 - pre-fetch the day after tomorrow's races.
#   12:30 - pre-fetch three days out's races (fields are usually already
#     declared that far ahead).
#   23:00 - collect today's race results (mainly Step 1; Step 2 harmlessly
#     no-ops - today's card is already fetched by then).
#
# HISTORY (Aug 2026): this used to run on GitHub's own `schedule` event -
# 11 UTC cron entries (an AEST and an AEDT candidate per local-time slot
# above, DST-resolved at run time by resolve_daily_target.py against the
# real Melbourne clock). That proved exactly as unreliable as the same
# `schedule` mechanism already was for price_refresh.yml (see its own
# HISTORY note): audited against real run history over 2.5 days, only 2 of
# the ~15 expected firings actually landed inside their target window and
# did real work - the rest either silently missed every window or fired at
# times matching none of the 11 configured cron minutes at all. Concrete
# damage: the pre-fetch that should have populated tomorrow's/day+2's/
# day+3's card never ran for a full day, so the CSV had zero rows for the
# next race day even after it had already started locally.
#
# Replaced with the same fix already proven for price_refresh.yml: six
# separate external cron-job.org schedules (one per local-time slot above,
# in Australia/Melbourne time so cron-job.org itself handles the AEST/AEDT
# shift) calling this workflow's workflow_dispatch endpoint directly, each
# passing the inputs below instead of a literal date - the actual target
# date is still computed from the REAL Melbourne clock at run time (see
# the "Fetch TopRate data and rebuild" step), so an off-by-an-hour firing
# from cron-job.org's own DST handling can't land on the wrong date. No
# `schedule` trigger here any more; if cron-job.org itself ever goes down,
# the fallback is a manual trigger from the Actions tab (or the dashboard's
# own workflow_dispatch calls) until it's restored.
#
# IMPORTANT: every morning slot explicitly resolves to --date (including
# "today", which used to run bare/no-date). fetch_todays_races() SKIPS
# entirely when called bare (target_date_str=None) and rows for that date
# already exist - which, once pre-fetching 1-3 days ahead is routine, is
# true for EVERY day by the time it actually arrives (it was pre-fetched
# days earlier). Passing --date explicitly instead takes the "re-fetch,
# removing stale pending rows first" branch every time, so today's field
# still gets a genuine refresh (scratches, barrier/going changes, prize
# money) on race day itself, not just whatever was captured days out.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch (YYYY-MM-DD). Leave blank for today.'
        required: false
        type: string
      days_ahead:
        description: 'cron-job.org use: fetch N days ahead of the real current Melbourne date (0=today/re-fetch, 1=tomorrow, 2, 3). Ignored if `date` is set.'
        required: false
        type: string
      mode:
        description: 'cron-job.org use: set to "results" for the 23:00 results-collection slot (runs bare, no --date). Ignored if `date` or `days_ahead` is set.'
        required: false
        type: string

# Avoid concurrent runs - if the user mashes the Fetch button, queue rather than
# parallel-execute (parallel pushes would race-condition the CSV commits).
#
# SHARED group name, TRIED then REVERTED same day (Sep 2026, speed_map
# rollout): briefly shared one "toprate-git-push" group with tab_results.yml/
# price_refresh.yml to stop this job's git-pull-rebase timeouts (see that
# step's own comment - 3 consecutive real publish failures, each from a
# concurrent tab_results.yml push landing mid-rebase). That fix worked for
# THIS job but broke tab_results.yml far worse: an unrelated, still-
# unexplained extra trigger was firing this workflow every ~15 min that
# same day, and sharing the lock meant tab_results (needs to run every 5
# min for live results) got queued out and CANCELLED repeatedly whenever
# this job held it - confirmed live (2026-09-16, real user report: Caulfield
# results silently stopped updating for ~1hr15 while this was live).
# Reverted back to this job's own separate group the same day. The
# git-pull-rebase timeout/job-timeout bumps below are KEPT (they cost
# nothing and still help this job self-recover from a real collision) -
# only the shared-lock idea was reverted, since starving a live, time-
# sensitive results feed is a worse failure mode than this job occasionally
# needing a manual retrigger.
concurrency:
  group: toprate-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Raised from 20 (Sep 2026): the fetch/rebuild step alone has been
    # observed taking ~7.5 min, and the commit/push retry loop below can now
    # legitimately need several 60s-bounded attempts - 20 min left too
    # little headroom and was the exact ceiling that turned one hung `git
    # pull --rebase` into a cancelled run (see that step's own comment).
    #
    # Raised again 30 -> 40 (Sep 2026, speed_map rollout): 3 consecutive
    # real runs all failed the SAME way - every `git pull --rebase` attempt
    # (15 total across the 3 runs) hit exactly the old 60s per-attempt bound
    # and got aborted, never completing a single rebase. A full daily
    # rebuild's own commit (today's whole field re-projected) produces a
    # genuinely large diff against toprate_runners.csv (~90MB, kept as text
    # - see .gitattributes), and 60s was never enough for that specific
    # 3-way merge cost even once, let alone 5 times - see the pull step's
    # own timeout bump below. 40 min gives that headroom without the
    # 60s->240s pull change alone being able to blow the job timeout.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push CSV+HTML changes back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependencies are pinned in requirements.txt - in particular
      # scikit-learn, because the saved WPR model (a HistGradientBoosting
      # pickle) fails to load under a different sklearn version ("No module
      # named '_loss'"). Installing from the pinned file keeps the Action's
      # sklearn identical to the version the model was trained under.
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─────────────────────────────────────────────────────────
      # Step 1: Fetch TopRate data + rebuild HTML.
      # Deliberately NOT passing --publish here: that flag makes
      # toprate_daily.py run its own git commit/push (publish() in
      # toprate_daily.py), meant for local/manual runs where the
      # machine's git identity is already configured. In this Action
      # there's no git identity set at that point, so it always failed
      # ("Commit failed.") - harmlessly, since the separate "Commit and
      # push if changed" step below already commits and pushes the same
      # files with its own properly configured identity. Running both
      # would also apply different conflict-resolution strategies on a
      # collision (-X ours here vs -X theirs below), so only one should
      # be active - this step's own commit/push is the one that's
      # actually been working every run.
      # ─────────────────────────────────────────────────────────
      - name: Fetch TopRate data and rebuild
        env:
          TOPRATE_EMAIL: ${{ secrets.TOPRATE_EMAIL }}
          TOPRATE_PASSWORD: ${{ secrets.TOPRATE_PASSWORD }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python toprate_daily.py --date "${{ inputs.date }}"
          elif [ "${{ inputs.mode }}" = "results" ]; then
            # cron-job.org's 23:00 Melbourne call - collect today's results.
            # Runs bare (no --date): today's card is already fetched by now,
            # so Step 1's fetch harmlessly no-ops and results collection is
            # the real work here.
            python toprate_daily.py
          elif [ -n "${{ inputs.days_ahead }}" ]; then
            # cron-job.org's 09:00/09:30/11:30/12:00/12:30 Melbourne calls -
            # each passes how many days ahead of the REAL current Melbourne
            # date to fetch, computed here (not by cron-job.org) so an
            # hour of DST drift in when the call lands can't shift it onto
            # the wrong date.
            TARGET=$(TZ=Australia/Melbourne date -d "+${{ inputs.days_ahead }} days" +%Y-%m-%d)
            echo "days_ahead=${{ inputs.days_ahead }} -> Melbourne date $TARGET"
            python toprate_daily.py --date "$TARGET"
          else
            # Manual dispatch with no inputs at all (e.g. the dashboard's
            # "Fetch today" button, or a human running the workflow from
            # the Actions tab) - always do real work for today's Melbourne
            # date right now.
            TODAY=$(TZ=Australia/Melbourne date +%Y-%m-%d)
            echo "Manual dispatch, no inputs given - fetching today's Melbourne date: $TODAY"
            python toprate_daily.py --date "$TODAY"
          fi

      # ─────────────────────────────────────────────────────────
      # Step 2: Commit and push refreshed data + HTML.
      #
      # toprate_price_history.csv IS staged (Aug 2026, explicit user
      # request - was previously deliberately excluded as local-only, but
      # that meant it could never actually accumulate across the Action's
      # ephemeral runs, so the intraday price-trend feature had no real
      # data source in production). wpr_form_history.csv.gz IS staged: the
      # gzipped form history (~25MB) stays under GitHub's 100MB limit and MUST
      # be committed so it persists across the Action's ephemeral runs - the
      # append in flush_wpr_form_history needs the prior file to accumulate.
      # (The raw uncompressed CSV previously crossed 100MB and broke pushes.)
      # ─────────────────────────────────────────────────────────
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage everything that the daily run might have updated
          [ -f toprate_runners.csv ] && git add toprate_runners.csv
          [ -f toprate_model_picks.csv ] && git add toprate_model_picks.csv
          [ -f toprate_live.html ] && git add toprate_live.html
          # The dashboard's data payload - without this the automated runs
          # regenerate it locally but never publish it, so the live site's
          # data only actually updates on a manual `deploy.bat` run (which
          # goes through toprate_daily.py's publish() and does include it).
          [ -f toprate_data.json ] && git add toprate_data.json
          # Gzipped WPR form history - committed so it persists and accumulates
          # across ephemeral Action runs (append needs the prior file).
          [ -f wpr_form_history.csv.gz ] && git add wpr_form_history.csv.gz
          # Price snapshot log - same accumulate-across-runs reasoning as
          # wpr_form_history.csv.gz above. snapshot_prices() already caps it
          # to a rolling 7 days, bounding its size.
          [ -f toprate_price_history.csv ] && git add toprate_price_history.csv
          # WPR model artifacts - committed so toprate_daily.py can load them.
          # Static unless retrained, but staging them is harmless if unchanged.
          [ -d wpr_models ] && git add wpr_models
          # Per-meeting horse form history files (build_horse_history_files(),
          # called from rebuild_html() above) - git-tracked but was missing
          # from this staging list (Sep 2026 bug), which left the working
          # tree dirty on any run where it actually changed content. Harmless
          # on a clean push, but the moment `git push` below got rejected by
          # a concurrent push (e.g. the 5-min price_refresh.yml job) and fell
          # back to `git pull --rebase`, git refused to start with unstaged
          # changes present, the `git rebase --abort` fallback then failed
          # too (no rebase was ever in progress), and under this script's
          # `bash -e` that killed the whole retry loop on attempt 1 instead
          # of retrying - see the 2026-09-14 run failures this caused.
          [ -d horse_history ] && git add horse_history
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily fetch $(date -u +%Y-%m-%dT%H:%MZ)"
          # Pull-then-push with retry. The remote moves often (5-min price
          # refresh, manual pushes), so a plain push frequently hits a
          # non-fast-forward rejection. Rebase our commit on top of whatever
          # arrived and retry.
          #
          # -X ours (not -X theirs) is deliberate: --ours/--theirs are
          # INVERTED in `git pull --rebase` vs. a normal merge - --ours
          # means the upstream/incoming commit, --theirs means this job's
          # own local commit being replayed. The repo's policy is "always
          # take incoming for these generated files" (see CLAUDE.md's
          # Deploy section - a real incident happened when a plain merge's
          # --theirs got copy-pasted into a rebase context), so -X ours is
          # the flag that actually means that here. (This step had -X
          # theirs until Sep 2026 - backwards the whole time, matching
          # tab_results.yml's own comment about this exact class of
          # mistake; fixed to match that file's already-correct version.)
          #
          # Every git call is wrapped in `timeout`, same reasoning as
          # tab_results.yml's identical loop: confirmed live (Sep 2026, run
          # 34816070609) that an unbounded `git pull --rebase` here can
          # hang completely silently for 12+ minutes - most likely the cost
          # of a real 3-way text merge on toprate_runners.csv (~90MB,
          # deliberately kept as text, see .gitattributes) once genuine
          # overlapping row changes are present on both sides - until this
          # job's own 20-minute timeout kills the whole run ("cancelled",
          # not "failed", with zero log output in between to show what was
          # stuck). Bounding each call turns that into a fast, loud "TIMED
          # OUT" line naming the exact command instead of silently burning
          # the entire job budget.
          #
          # git pull --rebase's own bound raised 60s -> 240s (Sep 2026,
          # speed_map rollout): 3 consecutive real runs each burned all 5
          # retries with EVERY pull attempt (15 total) hitting the old 60s
          # wall and getting aborted - never once completing, not just
          # occasionally slow. A full daily rebuild's own commit (today's
          # whole field re-projected) makes a genuinely large diff against
          # toprate_runners.csv, and 60s was never long enough for that
          # specific 3-way merge, regardless of how many times it retried.
          # git push's own 60s bound is UNCHANGED - the evidence points at
          # the pull/rebase step specifically (every observed push failure
          # was a near-instant rejection, not a timeout), so only the side
          # that actually needs more time got it. See this job's own
          # timeout-minutes comment above for how the two bounds interact.
          for i in 1 2 3 4 5; do
            push_status=0
            timeout 60 git push || push_status=$?
            if [[ $push_status -eq 0 ]]; then
              echo "Pushed on attempt $i"
              exit 0
            elif [[ $push_status -eq 124 ]]; then
              echo "git push TIMED OUT after 60s (attempt $i)"
            else
              echo "git push failed, exit $push_status (attempt $i)"
            fi
            pull_status=0
            timeout 240 git pull --rebase -X ours --no-edit || pull_status=$?
            if [[ $pull_status -eq 124 ]]; then
              echo "git pull --rebase TIMED OUT after 240s (attempt $i) - aborting"
              git rebase --abort 2>/dev/null || true
            elif [[ $pull_status -ne 0 ]]; then
              echo "git pull --rebase failed, exit $pull_status (attempt $i) - aborting"
              git rebase --abort 2>/dev/null || true
            fi
            sleep 3
          done
          echo "Push failed after retries"
          exit 1
