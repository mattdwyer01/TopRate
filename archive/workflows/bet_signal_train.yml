name: TopRate bet signal model training

# Retrains the market-residual win model (betsignal/train.py, about 8 minutes) on all results through the latest file and commits the model
# files. Weekly is enough: the backtest retrained once a year and the model is heavily regularised. Run it by hand after a big results backfill.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * 0'   # Sunday 16:17 UTC (Monday 02:17 AEST), a quiet time

concurrency:
  group: bet-signal-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: betsignal/requirements.txt

      - name: Install deps
        run: pip install -r betsignal/requirements.txt

      - name: Train
        run: python betsignal/train.py

      - name: Commit and push models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betsignal/models/bet_seed1.txt betsignal/models/bet_seed2.txt betsignal/models/bet_seed3.txt betsignal/models/meta.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Retrain bet signal model $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if timeout 60 git push origin HEAD:main; then exit 0; fi
            timeout 120 git fetch origin main
            git reset --mixed origin/main
            git add betsignal/models/bet_seed1.txt betsignal/models/bet_seed2.txt betsignal/models/bet_seed3.txt betsignal/models/meta.json
            git commit -m "Retrain bet signal model $(date -u +%Y-%m-%d)" || exit 0
            sleep $((i * 3))
          done
          exit 1
